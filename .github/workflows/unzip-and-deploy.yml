name: Compilar y Desplegar Vite-React a GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraer proyecto ZIP
        run: |
          unzip crypto-vault.zip -d ./app
          if [ -d "./app/project" ]; then cp -r ./app/project/* .; elif [ -d "./app/crypto-vault" ]; then cp -r ./app/crypto-vault/* .; else cp -r ./app/* .; fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Inyectar Base Path en Configuración de Vite
        run: |
          if [ -f "vite.config.ts" ]; then
            sed -i "s/defineConfig({/defineConfig({\n  base: '\/crypto-vault-dashboard\/',/g" vite.config.ts
          elif [ -f "vite.config.js" ]; then
            sed -i "s/defineConfig({/defineConfig({\n  base: '\/crypto-vault-dashboard\/',/g" vite.config.js
          fi

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Compilar Proyecto (Build Vite)
        run: npm run build

      - name: Configurar Páginas
        uses: actions/configure-pages@v5

      - name: Subir artefacto compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
